<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NaaSongs.Com.C0</title>
    <style>
        body{
            font-family: Arial, sans-serif;
        }
        .container{
            width: 80%;
            margin: auto;
        }
        nav{
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
        }
        .int,.btn{
            padding: 8px;
        }
        .btn{
            color: red;
            margin-left:-10px;
            background-color: red;
            color: white;
            
        }
       
        .menu ul{
            display: flex;
            width: 80%;
            list-style: none;
            gap: 20px;
            background-color: #333;
            padding: 10px;
            
           
        }
    
        
        .menu ul li a{
            color: white;
            text-decoration: none;
            font-size: 18px;
            
        }
        .menu ul li a:hover{
            background-color:red;
            width: 100%;
            height: 100%;
            padding: 10px;
         
            margin: -10px;;
        }
        .menu ul li a:focus{
            background-color:green;
            width: 100%;
            height: 100%;
            padding: 10px;
         
            margin: -10px;;
         }
        .menu ul li a:active{
            background-color:blue;
            width: 100%;
            height: 100%;
            padding: 10px;
            margin: -10px;
           
        }
        hr{
            border: 1px solid #333;
            margin-right: 200px;
        }
    

        .menu ul {
                display: flex;
                flex-direction:row;
                width: 80%;
                
            }
        @media (max-width: 700px) {
           nav{
            display: flex;
            flex-direction: column;
           }
           .menu ul{
            width: 100%;
           }
           .menu ul li{
            text-align: center;
           }
           img{
            width: 100%;
            height: auto;
           }
        }
                
            
       

            
       
    </style>
</head>
<body>
    <div class="container">
   
    <header>
        <nav>
        <h1> NaaSongs.Com.C0</h1>
        <div class="input">
            <input class="int" type="text" placeholder="search for songs, albums, artists" required>
            <button class="btn">Search</button>
        </div>
        </nav>
        <div class="menu">
            <ul>
                <li><a href="#">HOME</a></li>
                <li><a href="#">TELUGU</a></li>
                <li><a href="#">TAMIL</a></li>
            </ul>
        </div>

    </header>
    <main>
        <h3>CATEGORY:TAMIL</h3>
        <div class="songs">
            <div class="song1">
                <img src="https://naasongs.com.co/wp-content/uploads/2026/05/DC-2026.jpg"width="200" height="200" alt="this is image">
                <h2>DC(2026)-TAMIL</h2>
               <hr>
            </div>
            <div class="song2">
                <img src="https://naasongs.com.co/wp-content/uploads/2025/07/Karuppu-2025.jpg" alt="this is image" width="200" height="200">
                <h2>Karuppu(2026)</h2>
                                    <hr>
            </div>
            <div class="song3">
               <img src="https://naasongs.com.co/wp-content/uploads/2026/03/Kara-2026.jpg" alt="this is image" width="200" height="200">
                <span><h2>Kara(2026)</h2></span>
                <hr>
            </div>
                <div class="song4">
                <img src="https://naasongs.com.co/wp-content/uploads/2026/03/Vishwanath-And-Sons-Tamil-Songs.jpg" alt="this is image" width="200" height="200">
                <span><h2>Vishwanath And Sons(2026)</h2></span>
                <hr>
            </div>
                <div class="song5">
                <img src="https://naasongs.com.co/wp-content/uploads/2026/01/Jana-Nayagan-Songs-Download-Naa-Songs-2026.jpg" alt="this is image" width="200" height="200">
                <span><h2>Jana Nayagan(2026)</h2></span>
                <hr>
            </div>
                <div class="song6">
                <img src="https://naasongs.com.co/wp-content/uploads/2025/12/Jana-Nayagan-2025.jpg" alt="this is image" width="200" height="200">
                <span><h2>Jana Nayagan(2025)</h2></span>
                <hr>
            </div>
            
        </div>
            

    </main>
    
    
</body>
</html>
